name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/help-for-me/ai-endurance-coach:slim
            ghcr.io/help-for-me/ai-endurance-coach:sha-${{ github.sha }}
